# QueJuicio — revisa si hay tareas vencidas y manda push por FCM.
#
# ⏸️  PAUSADO (julio 2026): la ejecución automática diaria está desactivada.
# Motivo: las notificaciones web NO llegan a la app Android nativa (el System
# WebView no soporta push), así que el aviso diario no aportaba y encima fallaba
# por la credencial. Para reactivarlo, descomenta el bloque "schedule" de abajo
# (y asegúrate de tener bien el secreto FIREBASE_SERVICE_ACCOUNT). Para
# notificaciones en la app nativa, la solución correcta es push nativo
# (@capacitor/push-notifications) — es una tarea aparte.
name: Avisar tareas vencidas

on:
  # schedule:
  #   - cron: "0 6 * * *"   # 06:00 UTC (08:00 Berlín verano / 07:00 invierno)
  # A mano: Actions → Avisar tareas vencidas → Run workflow. Por defecto es
  # solo una prueba (revisa la clave, Firestore y FCM sin mandar nada).
  workflow_dispatch:
    inputs:
      solo_probar:
        description: "Solo probar (no manda avisos ni marca nada)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v5

      - name: Preparar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Instalar dependencias
        working-directory: notify
        run: npm install --no-audit --no-fund

      - name: Enviar notificaciones
        working-directory: notify
        run: node index.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          # En las corridas del schedule no hay inputs: queda vacío y manda de verdad.
          SOLO_PROBAR: ${{ inputs.solo_probar }}

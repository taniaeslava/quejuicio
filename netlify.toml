# QueJuicio es un sitio estático puro (HTML/CSS/JS, sin compilación). Netlify
# publica la carpeta tal cual. Como los archivos de la app Android viven en
# android-app/ (fuera de la raíz), Netlify no intenta "construir" nada.
[build]
  publish = "."
  command = ""
  # Ahorro de créditos: solo desplegar cuando cambie algo de la app WEB. Si el
  # push solo tocó la app Android, la documentación, los avisos o las reglas,
  # Netlify se salta el despliegue (git diff sin cambios → sale 0 → skip).
  ignore = "git diff --quiet HEAD^ HEAD -- . ':!android-app' ':!notify' ':!.github' ':!firestore.rules' ':!*.md'"

# Como la app Android carga el sitio en vivo, no queremos que se quede pegada
# con una versión vieja: "no-cache" hace que el navegador/WebView revalide con
# el servidor en cada carga (usa 304 si no cambió, así que sigue siendo rápido).
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache"
